name: Android CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: '可选：高清服务地址，留空使用仓库变量 LULU_API_BASE_URL'
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: 安装后端测试依赖
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: 检查角色素材（允许尚未提供）
        run: python scripts/check-assets.py
      - name: 验证任务幂等、访问边界与掩码外保护
        working-directory: backend
        run: pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: backend/test-results.xml
          if-no-files-found: error

  build:
    needs: backend-test
    env:
      LULU_API_BASE_URL: ${{ inputs.api_base_url || vars.LULU_API_BASE_URL || 'https://api.example.invalid' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # 覆盖上游默认的 tools platform-tools；tools 已无法从 SDK 仓库安装。
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: 准备锁定的 Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: 下载锁定的人体姿态模型
        run: ./scripts/download-models.sh
      - name: 静态检查与单元测试
        working-directory: android
        run: ./gradlew -PLULU_API_BASE_URL="$LULU_API_BASE_URL" lintDebug testDebugUnitTest
      - name: 构建内测 APK
        working-directory: android
        run: ./gradlew -PLULU_API_BASE_URL="$LULU_API_BASE_URL" assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: lulucamera-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
